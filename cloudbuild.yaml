steps:
  # 1. Scan des secrets (Gitleaks)
  # Vérifie qu'aucun mot de passe ou clé n'est présent dans le code.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'scan-secrets'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker run --rm \
        -v /workspace:/workspace \
        zricethezav/gitleaks:latest detect --source=/workspace || true

  # 2. Scan des vulnérabilités (Trivy)
  # Analyse les failles de sécurité dans tes dépendances.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'scan-vulns'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker run --rm \
        -v /workspace:/workspace \
        aquasec/trivy:latest fs /workspace || true

  # 3. Build de l'image Docker
  # Construction de l'image à partir du Dockerfile.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/my-app:$SHORT_SHA'
      - '.'

  # 4. Déploiement sur Cloud Run
  # Cette étape utilise l'image construite juste avant.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloudrun'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'test'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/my-app:$SHORT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--quiet'

# SECTION CRUCIALE : Le "Push" natif
# C'est ici que Cloud Build envoie l'image vers Artifact Registry automatiquement.
# Cela règle ton erreur de permission 'iam.serviceAccounts.get'.
images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/my-app:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
