steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/project-22d9f26b-a75f-4092-b59/cloud-run-source-deploy/my-app:$SHORT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/project-22d9f26b-a75f-4092-b59/cloud-run-source-deploy/my-app:$SHORT_SHA'

images:
  - 'europe-west1-docker.pkg.dev/project-22d9f26b-a75f-4092-b59/cloud-run-source-deploy/my-app:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
