steps:
  - name: 'gitleaks/gitleaks'
    entrypoint: 'sh'
    args: ['-c', 'gitleaks detect --source=.']

  - name: 'aquasecurity/trivy'
    entrypoint: 'sh'
    args: ['-c', 'trivy fs --exit-code 1 . || exit 0']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/project-22d9f26b-a75-4092-b59/cloud-run-source-deploy/my-app:$SHORT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/project-22d9f26b-a75-4092-b59/cloud-run-source-deploy/my-app:$SHORT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: ['run', 'deploy', 'test', '--image', 'europe-west1-docker.pkg.dev/project-22d9f26b-a75-4092-b59/cloud-run-source-deploy/my-app:$SHORT_SHA', '--region', 'europe-west1', '--platform', 'managed', '--quiet']

images:
  - 'europe-west1-docker.pkg.dev/project-22d9f26b-a75-4092-b59/cloud-run-source-deploy/my-app:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
