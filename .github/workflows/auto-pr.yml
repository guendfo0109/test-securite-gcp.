name: Auto PR to main

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  auto_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create PR if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BASE="main"

          echo "Current branch: $BRANCH"

          if [ "$BRANCH" = "$BASE" ]; then
            echo "On main branch. Skipping."
            exit 0
          fi

          # Check if PR already exists
          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number -q '.[0].number' || true)

          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            exit 0
          fi

          echo "Creating PR..."
          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "Auto PR: $BRANCH → $BASE" \
            --body "Pull request créée automatiquement."
