name: Auto PR to main

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  auto_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR to main
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          title: "Auto PR: ${{ github.ref_name }} → main"
          body: |
            PR créée automatiquement après un push sur `${{ github.ref_name }}`.
            - Auteur: ${{ github.actor }}
            - Commit: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          delete-branch: false
